<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <meta name="robots" content="noindex" />
  <script>
    // GitHub Pages serves 404.html for unknown routes.
    // We redirect to product.html and pass the original path in ?p=
    var p = location.pathname + location.search + location.hash;
    location.replace('/product.html?p=' + encodeURIComponent(p));
  </script>
</head>
<body></body>
</html>
