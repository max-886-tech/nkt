<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sana Bags | Contact</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="container">
      <a href="mailto:{{TOP_EMAIL}}">{{TOP_EMAIL}}</a>
      <span class="sep">•</span>
      <a href="tel:{{TOP_PHONE_TEL}}">{{TOP_PHONE}}</a>
    </div>
  </div>

  <header class="header">
    <div class="container header-row">
      <a class="brand" href="{{BASE}}/index.html">Sana Bags</a>
      <nav class="nav">
        <a href="{{BASE}}/index.html">Home</a>
        <a href="{{BASE}}/about.html">About</a>
        <a href="{{BASE}}/contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container content">
    <h1>Contact</h1>
    <p>Static contact page.</p>

    <div class="card pad">
      <p><strong>Phone:</strong> <a href="tel:{{TOP_PHONE_TEL}}">{{TOP_PHONE}}</a></p>
      <p><strong>Email:</strong> <a href="mailto:{{TOP_EMAIL}}">{{TOP_EMAIL}}</a></p>
      <p><strong>Address:</strong> {{FOOTER_ADDRESS}}</p>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <div>
        <h4>Contact</h4>
        <p class="muted">{{FOOTER_ADDRESS}}</p>
        <p><a href="tel:{{TOP_PHONE_TEL}}">{{TOP_PHONE}}</a><br><a href="mailto:{{TOP_EMAIL}}">{{TOP_EMAIL}}</a></p>
      </div>
      <div>
        <h4>Office Hours</h4>
        <p class="muted">{{OFFICE_HOURS}}</p>
      </div>
    </div>
    <div class="container footer-bottom">
      <small>© <span id="y"></span> Sana Bags</small>
    </div>
  </footer>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
